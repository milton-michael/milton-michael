name: Generate Streak Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=milton-michael&theme=dark&timezone=Asia/Kolkata"
          path: "streak.svg"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub Streak Stats"
          file_pattern: streak.svg
