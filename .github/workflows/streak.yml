name: Generate Streak Card

on:
  schedule:
    - cron: "0 0 * * *" # Updates daily at midnight
  workflow_dispatch: # Allows you to manually trigger it

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=milton-michael&theme=dark"
          path: "streak.svg"

      - name: Commit and Push SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub Streak Stats"
          file_pattern: streak.svg
